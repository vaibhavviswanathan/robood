[project]
name = "robood"
version = "0.1.0"
description = "Out-of-distribution detection for Vision-Language-Action robot policies"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
vlm = ["anthropic", "pillow"]
encoder = ["torch", "torchvision"]
clustering = ["hdbscan"]
sim = ["robosuite"]
datasets = ["lerobot", "datasets", "Pillow", "h5py"]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "vla_ood_detector.py",
    "vla_failure_mode_identifier.py",
    "vla_ood_demo.py",
    "evaluate_ood.py",
    "frame_sources.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
